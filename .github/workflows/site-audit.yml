name: Static site QA
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate sitemap, metadata and internal links
        run: python tools/validate_site.py
      - name: Validate full-screen menu JavaScript syntax
        run: node --check assets/menu-2026.js
